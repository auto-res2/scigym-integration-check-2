err += np.sum((sol.y.T - df[sps].iloc[idx].values)**2)\n    return total_err\n\nres_opt = minimize(loss, M1.flatten(), method='Nelder-Mead', options={'maxiter': 2000, 'xatol': 1e-4, 'fatol': 1e-4})\nM_opt = res_opt.x.reshape(4, 4)\nprint(\"Optimized Matrix:\")\nprint(np.round(M_opt, 4))\nprint(\"Nice rounded Matrix:\")\nM_nice = np.round(M_opt, 2)\nprint(M_nice)\n\n# Let's check loss of M_nice:\nprint(\"Loss of M_nice:\", loss(M_nice.flatten()))\n\n# Now, let's identify the elementary reactions from M_nice:\n# For subsystem 1: [A, B, C, D] = ['id_unf3', 'id_8zfj', 'id_0art', 'id_uenr']\n# And subsystem 2: [A, B, C, D] = ['id_56er', 'id_dk7v', 'id_bjlo', 'id_7iiw']\n\n# Let's inspect the columns of M_nice:\n# Each column j represents what happens when species j is present:\n# dX/dt = sum_j (col_j * X_j)\n# If col_j has negative diagonal M_jj = -k, and positive off-diagonals M_ij = k * s_i:\n# This corresponds to reaction(s) with reactant species j!\n# For each species j (reactant):\n# If all other elements in col_j have a common factor or represent products:\n# Let's print out reactions corresponding to each column:\n\ndef add_reactions_for_subsystem(model, sps, M, prefix):\n    # sps = [A, B, C, D]\n    for j, react_sp in enumerate(sps):\n        # The effect of species j is M[:, j] * react_sp\n        # Positive entries are produced, negative entry (at j) is consumed\n        # Let's see: if M[:, j] has positive and negative entries:\n        col = M[:, j]\n        # Any positive rate:\n        for i, prod_sp in enumerate(sps):\n            if i != j and col[i] > 1e-5:\n                rate_const = col[i]\n                # Reaction: react_sp -> prod_sp with rate rate_const * react_sp\n                rxn = model.createReaction()\n                rxn_id = f\"{prefix}_rxn_{react_sp}_to_{prod_sp}\"\n                rxn.setId(rxn_id)\n                rxn.setReversible(False)\n                rxn.setFast(False)\n                \n                reactant = rxn.createReactant()\n                reactant.setSpecies(react_sp)\n                reactant.setStoichiometry(1.0)\n                reactant.setConstant(True)\n                \n                product = rxn.createProduct()\n                product.setSpecies(prod_sp)\n                product.setStoichiometry(1.0)\n                product.setConstant(True)\n                \n                # Kinetic law\n                kl = rxn.createKineticLaw()\n                kl.setFormula(f\"{rate_const:.6g} * {react_sp}\")\n\n# Build the complete SBML model\ndoc = libsbml.readSBMLFromString(input_sbml_string)\nmodel = doc.getModel()\n\nsub1 = ['id_unf3', 'id_8zfj', 'id_0art', 'id_uenr']\nsub2 = ['id_56er', 'id_dk7v', 'id_bjlo', 'id_7iiw']\n\nadd_reactions_for_subsystem(model, sub1, M_nice, \"sub1\")\nadd_reactions_for_subsystem(model, sub2, M_nice, \"sub2\")\n\nwriter = libsbml.SBMLWriter()\nfinal_sbml = writer.writeSBMLToString(doc)\n\n# Verify with simulate()\nsim_df = simulate(final_sbml)\nprint(\"Simulation successful! Output shape:\", sim_df.shape)\nprint(\"Submission ready!\")\n```"
