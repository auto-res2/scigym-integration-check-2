setStoichiometry(1.0)\ns_out3 = r3.createProduct()\ns_out3.setSpecies(\"id_bya5\")\ns_out3.setStoichiometry(1.0)\nkl3 = r3.createKineticLaw()\np3 = kl3.createParameter()\np3.setId(\"k3\")\np3.setValue(float(p_ma[4]))\np3r = kl3.createParameter()\np3r.setId(\"k3_rev\")\np3r.setValue(float(p_ma[5]))\nkl3.setFormula(\"k3 * id_eyok - k3_rev * id_bya5\")\n\n# Test simulation with simulate()\ntest_sbml = libsbml.writeSBMLToString(doc)\nsim_df = simulate(test_sbml)\nprint(\"Simulation successful, head:\")\nprint(sim_df.head())\n\nfinal_sbml = test_sbml\n```"
