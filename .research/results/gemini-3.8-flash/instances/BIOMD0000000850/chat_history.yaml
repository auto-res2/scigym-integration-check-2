'products': [('id_ri7q', 1.0)],\n        'formula': f'{k2:.6f} * id_jz57'\n    },\n    'r_r_deg': {\n        'reactants': [('id_ri7q', 1.0)],\n        'formula': f'{k3:.6f} * id_ri7q'\n    },\n    'r_n_prod': {\n        'modifiers': [('id_ri7q',)],\n        'products': [('id_nzce', 1.0)],\n        'formula': '0.01 * id_ri7q'\n    },\n    'r_n_deg': {\n        'reactants': [('id_nzce', 1.0)],\n        'formula': '0.1 * id_nzce'\n    }\n}\ncandidate_models.append(('Hill_inhibition', rxns1))\n\n# Candidate 2: Mass action from Ridge/Lasso / linear regression:\n# Let's find best linear/polynomial model:\n# dR = c0 + c_j*J + c_r*R + ...\n# dJ = d0 + d_j*J + d_n*N + ...\nres_R_lst = np.linalg.lstsq(X_poly[:, :4], dR, rcond=None)[0]\nres_J_lst = np.linalg.lstsq(X_poly[:, :4], dJ, rcond=None)[0]\nprint(\"Linear dR coefs (1, R, N, J):\", res_R_lst)\nprint(\"Linear dJ coefs (1, R, N, J):\", res_J_lst)\n\n# Let's simulate Candidate 1:\nsbml_cand1 = build_model(rxns1)\ntry:\n    sim1 = simulate(sbml_cand1)\n    err1 = np.mean((sim1['id_ri7q'].values - df0['id_ri7q'].values)**2)\n    print(\"Candidate 1 sim MSE on iter0:\", err1)\nexcept Exception as e:\n    print(\"Sim 1 failed:\", e)\n\n# If Candidate 1 or an optimized version works, let's fine-tune parameters using least_squares against the trajectory:\ndef sim_error(p):\n    V1, K1, n1, k2, k3 = p\n    rxns = {\n        'r_j_prod': {'products': [('id_jz57', 1.0)], 'modifiers': [('id_nzce',)], 'formula': f'{V1} / (1 + (id_nzce / {K1})^{n1})'},\n        'r_j_to_r': {'reactants': [('id_jz57', 1.0)], 'products': [('id_ri7q', 1.0)], 'formula': f'{k2} * id_jz57'},\n        'r_r_deg': {'reactants': [('id_ri7q', 1.0)], 'formula': f'{k3} * id_ri7q'},\n        'r_n_prod': {'modifiers': [('id_ri7q',)], 'products': [('id_nzce', 1.0)], 'formula': '0.01 * id_ri7q'},\n        'r_n_deg': {'reactants': [('id_nzce', 1.0)], 'formula': '0.1 * id_nzce'}\n    }\n    s = build_model(rxns)\n    try:\n        sim_df = simulate(s)\n        # sample 50