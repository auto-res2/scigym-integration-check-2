mode: full
results_dir: .research/results

data_root: data/scigym_sbml  # small / large の親。run の yaml の split で選ぶ。無ければ HuggingFace（h4duan/scigym-sbml）から取得
base_url: https://ai-gateway.vercel.sh/v1
max_iterations: 5
eval_debug_rounds: 3
temperature: 1.0
max_tokens: 32768
workers: 16
instance_timeout: 3600  # 統合確認なので短く（1 件 1 試行の上限秒）
stall_timeout: 900  # 出力が止まってから打ち切るまでの秒数。統合確認なので短く
resume_root: /data1/rkp00041/rku00122/resume  # 打ち切った run の完了済みの件（checkpoints/*.tar.gz）を run_id ごとに置く
